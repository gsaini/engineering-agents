name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Prompt changes are code changes. The golden set runs offline against
      # deterministic fixtures, so this is free and blocks on a per-stage drop
      # beyond tolerance — see docs/07-evaluation.md.
      - run: npm run eval:gate
